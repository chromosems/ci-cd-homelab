 deploy:
    runs-on: self-hosted
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose up --build -d
          sleep 5
          curl -f http://localhost/health || exit 1
name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check app/ tests/

      - name: Check code formatting
        run: ruff format --check app/ tests/

      - name: Run type checker
        run: mypy --ignore-missing-imports app/ tests/

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    runs-on: self-hosted
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          OLLAMA_BASE_URL=https://soft-consequently-coleman-custody.trycloudflare.com
          SECRET_KEY=demo-secret-change-in-production
          LOANS_CSV=data/loans.csv
          FAISS_INDEX_PATH=data/faiss_index
          LOANASSIST_DB=data/loanassist.db
          OLLAMA_MODEL=qwen3:8b
          FALLBACK_MODEL=loan-qwen
          CACHE_SIZE=128
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with Docker Compose
        run: |
          docker stop ci-cd-homelab || true
          docker rm ci-cd-homelab || true
          docker compose down || true
          docker compose pull
          docker compose up -d
          sleep 15
          curl -f http://localhost/health || exit 1